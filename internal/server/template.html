<!DOCTYPE html>
<html>

  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="markdown-title">{{ .Title }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    {{ if eq .Mode "dark" }}
    <link rel="stylesheet" href="/static/chroma-github-dark.css" />
    <link rel="stylesheet" href="/static/github-markdown-dark.css" />
    {{ else if eq .Mode "light" }}
    <link rel="stylesheet" href="/static/chroma-github-light.css" />
    <link rel="stylesheet" href="/static/github-markdown-light.css" />
    {{ else }}
    <link rel="stylesheet" href="/static/chroma-github-light.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="/static/github-markdown-light.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="/static/chroma-github-dark.css" media="(prefers-color-scheme: no-preference),(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/static/github-markdown-dark.css" media="(prefers-color-scheme: no-preference),(prefers-color-scheme: dark)" />
    {{ end }}

    <style>
    :root {
      --background-dark: #0d1117;
      --background-light: #ffffff;
      --color-dark: #c9d1d9;
      --color-light: #1f2328;
      --copy-icon-stroke-dark: #9198a1;
      --copy-icon-stroke-light: #59636e;
      --tick-icon-stroke-dark: #3fb950;
      --tick-icon-stroke-light: #3fb950;
    }

    {{ if eq .Mode "dark" }}
    body {
      background-color: var(--background-dark);
      color: var(--color-dark);
    }
    .copy-button svg.copy-icon {
      stroke: var(--copy-icon-stroke-dark);
      color: var(--copy-icon-stroke-dark);
    }
    .copy-button svg.tick-icon {
      stroke: var(--tick-icon-stroke-dark);
    }
    {{ end }}

    {{ if eq .Mode "light" }}
    body {
      background-color: var(--background-light);
      color: var(--color-light);
    }
    .copy-button svg.copy-icon {
      stroke: var(--copy-icon-stroke-light);
    }
    .copy-button svg.tick-icon {
      stroke: var(--tick-icon-stroke-light);
    }
    {{ end }}

    {{ if eq .Mode "auto" }}
    body {
      background-color: var(--background-dark);
      color: var(--color-dark);
    }
    .copy-button svg.copy-icon {
      stroke: var(--copy-icon-stroke-dark);
      color: var(--copy-icon-stroke-dark);
    }
    .copy-button svg.tick-icon {
      stroke: var(--tick-icon-stroke-dark);
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: var(--background-light);
        color: var(--color-light);
      }
      .copy-button svg.copy-icon {
        stroke: var(--copy-icon-stroke-light);
      }
      .copy-button svg.tick-icon {
        stroke: var(--tick-icon-stroke-light);
      }
    }
    {{ end }}

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 920px;
      margin: 0 auto;
      padding: 45px;
    }

    .copy-button {
      background-color: transparent;
      border: none;
      position: absolute;
      top: 8px;
      right: 8px;
      border-radius: 5px;
      padding: 5px;
      transition: border-width 0.2s ease;
      cursor: pointer;
    }

    @media (max-width: 767px) {
      .markdown-body {
        padding: 15px;
      }
    }

    /* Directory browsing styles */
    .browse-button-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .btn-browse,
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #238636;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .btn-browse:hover,
    .btn-back:hover {
      background: #2ea043;
    }

    .btn-browse svg,
    .btn-back svg {
      fill: white;
    }

    .directory-index {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    .back-to-readme {
      margin-bottom: 24px;
    }

    .directory-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #d0d7de;
    }

    {{ if eq .Mode "dark" }}
    .directory-title {
      border-bottom-color: #30363d;
    }
    {{ else if eq .Mode "light" }}
    .directory-title {
      border-bottom-color: #d0d7de;
    }
    {{ else }}
    @media (prefers-color-scheme: dark) {
      .directory-title {
        border-bottom-color: #30363d;
      }
    }
    @media (prefers-color-scheme: light) {
      .directory-title {
        border-bottom-color: #d0d7de;
      }
    }
    {{ end }}

    .folder-icon {
      fill: #54aeff;
    }

    .file-tree {
      border: 1px solid #d0d7de;
      border-radius: 6px;
      overflow: hidden;
    }

    {{ if eq .Mode "dark" }}
    .file-tree {
      border-color: #30363d;
    }
    {{ else if eq .Mode "light" }}
    .file-tree {
      border-color: #d0d7de;
    }
    {{ else }}
    @media (prefers-color-scheme: dark) {
      .file-tree {
        border-color: #30363d;
      }
    }
    @media (prefers-color-scheme: light) {
      .file-tree {
        border-color: #d0d7de;
      }
    }
    {{ end }}

    .file-item {
      border-bottom: 1px solid #d0d7de;
      padding: 0;
    }

    {{ if eq .Mode "dark" }}
    .file-item {
      border-bottom-color: #30363d;
    }
    {{ else if eq .Mode "light" }}
    .file-item {
      border-bottom-color: #d0d7de;
    }
    {{ else }}
    @media (prefers-color-scheme: dark) {
      .file-item {
        border-bottom-color: #30363d;
      }
    }
    @media (prefers-color-scheme: light) {
      .file-item {
        border-bottom-color: #d0d7de;
      }
    }
    {{ end }}

    .file-item:last-child {
      border-bottom: none;
    }

    .file-item a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease;
    }

    .file-item:hover {
      background-color: #f6f8fa;
    }

    {{ if eq .Mode "dark" }}
    .file-item:hover {
      background-color: #161b22;
    }
    {{ else if eq .Mode "light" }}
    .file-item:hover {
      background-color: #f6f8fa;
    }
    {{ else }}
    @media (prefers-color-scheme: dark) {
      .file-item:hover {
        background-color: #161b22;
      }
    }
    @media (prefers-color-scheme: light) {
      .file-item:hover {
        background-color: #f6f8fa;
      }
    }
    {{ end }}

    .file-item[data-depth="1"] a {
      padding-left: 32px;
    }

    .file-item[data-depth="2"] a {
      padding-left: 48px;
    }

    .file-item[data-depth="3"] a {
      padding-left: 64px;
    }

    .file-icon {
      flex-shrink: 0;
      fill: #57606a;
    }

    {{ if eq .Mode "dark" }}
    .file-icon {
      fill: #8b949e;
    }
    {{ else if eq .Mode "light" }}
    .file-icon {
      fill: #57606a;
    }
    {{ else }}
    @media (prefers-color-scheme: dark) {
      .file-icon {
        fill: #8b949e;
      }
    }
    @media (prefers-color-scheme: light) {
      .file-icon {
        fill: #57606a;
      }
    }
    {{ end }}

    .file-name {
      font-size: 14px;
    }

    @media (max-width: 767px) {
      .directory-index {
        padding: 10px;
        margin: 20px auto;
      }

      .browse-button-container {
        top: 10px;
        right: 10px;
      }

      .btn-browse,
      .btn-back {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
    </style>
  </head>

  <body>
    {{if .ShowBrowseButton}}
    <!-- Browse Files Button -->
    <div class="browse-button-container">
      <a href="/?view=index" class="btn-browse">
        <svg class="file-icon" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true">
          <path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"></path>
        </svg>
        Browse Files
      </a>
    </div>
    {{end}}

    {{if .IsDirectoryIndex}}
    <!-- Directory Index View -->
    <div class="directory-index">
      {{if .HasReadme}}
      <div class="back-to-readme">
        <a href="/" class="btn-back">
          <svg viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true">
            <path d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06l2.97-2.97H3.75a.75.75 0 0 1 0-1.5h7.44L8.22 4.03a.75.75 0 0 1 0-1.06Z"></path>
          </svg>
          Back to README
        </a>
      </div>
      {{end}}

      <h1 class="directory-title">
        <svg class="folder-icon" viewBox="0 0 16 16" version="1.1" width="24" height="24" aria-hidden="true">
          <path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"></path>
        </svg>
        Markdown Files
      </h1>

      <div class="file-tree">
        {{range .Files}}
        <div class="file-item" data-depth="{{.Depth}}">
          <a href="/{{.Path}}">
            <svg class="file-icon" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true">
              <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"></path>
            </svg>
            <span class="file-name">{{.Path}}</span>
          </a>
        </div>
        {{end}}
      </div>
    </div>
    {{else}}
    <article id="markdown-body" class="markdown-body">{{ .Body }}</article>
    {{end}}

    <script type="text/javascript">
      Param = {
        host: "{{ .Host }}", // type: string
        mode: "{{ .Mode }}", // type: string
        reload: {{ .Reload }}, // type: bool
      };

      MathJax = {
        tex: {
          inlineMath: [
            ['$', '$'],
            ['\\(', '\\)'],
          ],
          displayMath: [
            ['$$', '$$'],
            ['\\[', '\\]'],
          ],
        },
      };
    </script>
    <script type="text/javascript" src="/static/tex-mml-chtml.min.js"></script>
    <script type="text/javascript" src="/static/mermaid.min.js"></script>
    <script type="text/javascript" src="/static/script.js"></script>
  </body>

</html>
